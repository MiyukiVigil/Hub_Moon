[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "hub-moon"
# Read from moondrop_control.__version__ — the one place the version is written.
# setuptools resolves `attr:` by parsing the module's AST, so this does NOT import
# moondrop_control and therefore does not need hidapi present to build a wheel.
dynamic = ["version"]
description = "Control the parametric EQ on Moondrop USB DACs over USB HID — CLI + desktop GUI."
readme = "readme.md"
requires-python = ">=3.9"
license = { file = "LICENSE" }
authors = [{ name = "MiyukiVigil" }]
keywords = ["moondrop", "dac", "equalizer", "peq", "usb-hid", "audio"]
# hidapi drives the DAC; certifi gives the community-library HTTPS calls a CA
# bundle that works even where the OS trust store isn't found (macOS / frozen apps).
dependencies = ["hidapi>=0.14.0", "certifi"]

# The GUI is an optional extra so the CLI keeps its light footprint.
#   pip install hub-moon           → CLI only
#   pip install "hub-moon[gui]"    → CLI + desktop GUI
[project.optional-dependencies]
gui = ["slint>=1.13"]

[project.urls]
Homepage = "https://hubmoon.miyukivigil.tech"
Source = "https://github.com/MiyukiVigil/Hub_Moon"

[project.scripts]
# console entry: the full CLI (and `hub-moon --gui`)
hub-moon = "moondrop_control:main"

[project.gui-scripts]
# windowed entry (no console on Windows): straight to the GUI
hub-moon-gui = "gui.app:main"

[tool.setuptools]
# keep the CLI a single top-level module, exactly as it ships today
py-modules = ["moondrop_control"]

[tool.setuptools.dynamic]
version = { attr = "moondrop_control.__version__" }

[tool.setuptools.packages.find]
include = ["gui*"]

# ship the .slint sources alongside the gui package. They are compiled at startup, so
# they are data, not build inputs. There is no font to ship: the icons are vector
# outlines generated into ui/icons.slint by tools/build-icons.py.
[tool.setuptools.package-data]
gui = [
  "ui/*.slint",
  # the window icon, loaded by @image-url from app.slint at startup — data, not an
  # asset the build consumes, so it has to be in the installed package
  "ui/*.png",
]
