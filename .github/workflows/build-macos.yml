name: Build macOS app

# Builds a Hub Moon.app with PyInstaller and packages it as a .dmg (drag to
# Applications). Apple Silicon only — the Intel (x86_64) leg was dropped, since
# Rosetta 2 runs the arm64 build on the shrinking number of Intel Macs left and a
# second runner per release is not worth the wall-clock.
#
#   • push a tag vX.Y.Z  → the .dmg is attached to the GitHub Release
#   • "Run workflow"     → the .dmg is uploaded as an artifact
#
# NOTE: these builds are ad-hoc signed, not notarized (notarization needs a paid
# Apple Developer ID). On first launch macOS Gatekeeper will say the app is from
# an "unidentified developer" — right-click the app → Open (or run
# `xattr -dr com.apple.quarantine "/Applications/Hub Moon.app"`) to allow it.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Version string (e.g. 1.0.0)"
        required: false
        default: ""

permissions:
  contents: write

jobs:
  macos:
    runs-on: macos-14   # Apple Silicon (arm64)
    env:
      ARCH: arm64

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install project + build tools
        run: |
          python -m pip install --upgrade pip
          pip install ".[gui]" pyinstaller

      - name: Resolve version
        id: ver
        run: |
          inp="${{ github.event.inputs.version }}"
          ref="${{ github.ref_name }}"
          if   [ -n "$inp" ]; then v="$inp"
          elif [[ "$ref" == v* ]]; then v="${ref#v}"
          else v="0.0.0-$ref"; fi
          echo "version=$v" >> "$GITHUB_OUTPUT"
          echo "Building version $v ($ARCH)"

      - name: Build Hub Moon.app (PyInstaller)
        run: pyinstaller --noconfirm packaging/hub-moon.spec

      - name: Ad-hoc sign the app
        run: |
          # arm64 requires at least an ad-hoc signature to run at all
          codesign --force --deep --sign - "dist/Hub Moon.app"
          codesign --verify --deep --strict --verbose=2 "dist/Hub Moon.app" || true

      - name: Smoke-test the app
        # Same script as the Linux build — see the note there for why a passing test
        # suite says nothing about a bundle. macOS had the most to lose from the bug
        # that prompted it: `LD_LIBRARY_PATH`'s counterpart `DYLD_LIBRARY_PATH` pointed
        # every child at the bundle, so `hdiutil`, `ditto`, `xattr` and `codesign` all
        # failed, which is the entire .dmg updater.
        #
        # Run *after* signing rather than before, so it also catches a signature that
        # breaks the app — `codesign --deep` is capable of that and nothing else here
        # would notice, since `--verify` is allowed to fail without stopping the build.
        run: python3 tools/smoke-frozen.py "dist/Hub Moon.app"

      - name: Package .dmg
        run: |
          v="${{ steps.ver.outputs.version }}"
          arch="$ARCH"
          staging="dist/dmg"
          rm -rf "$staging"; mkdir -p "$staging"
          cp -R "dist/Hub Moon.app" "$staging/"
          ln -s /Applications "$staging/Applications"
          hdiutil create -volname "Hub Moon" -srcfolder "$staging" -ov -format UDZO \
            "dist/HubMoon-$v-macOS-$arch.dmg"
          rm -rf "$staging"

      # Hashed on the runner that built it — see the note in build-linux.yml. Named per
      # architecture so that adding an Intel job later cannot have two runners writing
      # SHA256SUMS-macos.txt over each other on the same release.
      - name: Checksums
        run: |
          cd dist
          shasum -a 256 HubMoon-*-macOS-*.dmg > "SHA256SUMS-macos-$ARCH.txt"
          cat "SHA256SUMS-macos-$ARCH.txt"

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: hub-moon-macos-arm64
          path: |
            dist/HubMoon-*-macOS-*.dmg
            dist/SHA256SUMS-macos-*.txt
          if-no-files-found: error

      - name: Attach to release (tagged builds only)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/HubMoon-*-macOS-*.dmg
            dist/SHA256SUMS-macos-*.txt
